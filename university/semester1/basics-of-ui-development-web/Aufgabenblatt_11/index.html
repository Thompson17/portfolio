<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <title>Formulare und Eingabemasken</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/function.js"></script>
    </head>
    <body>
        <h1>Bitte ausfüllen und absenden</h1>
        <form onsubmit="showInput()">
            <table>
                <tr>
                    <td><label for="vorname">Vorname*</label></td>
                    <td><input type="text" id="vorname" placeholder="Max" size="80" required></td>
                </tr>
                <tr>
                    <td><label for="nachname">Name*</label></td>
                    <td><input type="text" id="nachname" placeholder="Mustermann" size="80" required></td>
                </tr>
                <tr>
                    <td><label for="strasse">Straße*</label></td>
                    <td><input type="text" id="strasse" placeholder="Musterstraße" size="80" required></td>
                </tr>
                <tr>
                    <td><label for="postleitzahl">Postleitzahl*</label></td>
                    <td><input type="text" id="postleitzahl" placeholder="deutsche PLZ" pattern="[0-9]{5}" size="80" required></td>
                </tr>
                <tr>
                    <td><label for="ort">Ort*</label></td>
                    <td><input type="text" id="ort" placeholder="Musterdorf" size="80" required></td>
                </tr>
                <tr>
                    <td>Geschlecht*</td>
                    <td>
                        <input type="radio" name="geschlecht" id="weiblich" value="weiblich" required>
                        <label for="weiblich">weiblich</label>
                        <input type="radio" name="geschlecht" id="maennlich" value="männlich">
                        <label for="maennlich">männlich</label>
                        <input type="radio" name="geschlecht" id="divers" value="divers">
                        <label for="divers">divers</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="note">Ihre Note*</label></td>
                    <td>
                        <input id="note" list="noten" placeholder="..." size="80" required>
                        <datalist id="noten">
                            <option value="...">
                            <option value="sehr gut">
                            <option value="gut">
                            <option value="befriedigend">
                            <option value="ausreichend">
                            <option value="mangelhaft">
                            <option value="ungenügend">
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="abschluss">Abschluss</label></td>
                    <td>
                        <input id="abschluss" list="abschluesse" placeholder="..." size="80">
                        <datalist id="abschluesse">
                            <option value="...">
                            <option value="B.Eng">
                            <option value="B.A.">
                            <option value="B.Sc.">
                            <option value="B.???">
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="email">EmailId</label></td>
                    <td><input type="email" id="email" placeholder="mmustermann@hs-osnabrueck.de" size="80"></td>
                </tr>
                <tr>
                    <td><label for="handy">Handy</label></td>
                    <td><input type="tel" id="handy" pattern="0[0-9]{3,9}" placeholder="0151123456" size="80"></td>
                </tr>
                <tr>
                    <td><label for="bemerkungen">Bemerkungen:</label></td>
                    <td><textarea id="bemerkungen" rows="4" cols="80"></textarea></td>
                </tr>
                <tr>
                    <td><input type="reset" value="Reset"></td>
                    <td><input type="submit" value="Submit Form"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
