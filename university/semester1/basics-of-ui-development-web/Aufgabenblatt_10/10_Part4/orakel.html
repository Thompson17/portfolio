<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <title>Orakel</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="startseite">
            <form>
                <label for="gericht1">Gericht 1:</label><br>
                <input type="text" id="gericht1" name="gericht1" value="Pizza"><br>
                <label for="gericht2">Gericht 2:</label><br>
                <input type="text" id="gericht2" name="gericht2" value="Pommes"><br>
                <button type="button" id="submit">Entscheide</button>
            </form>
        </div>
        <div id="spielSeite">
            <div id="seiten">
                <div id="links">
                    <h2 id="gerichtLinks">Links</h2>
                </div>
                <div id="rechts">
                    <h2 id="gerichtRechts">Rechts</h2>
                </div>
            </div>
            <div id="mitte">
                <h2 id="textMitte">Bitte auf jedes Gericht einen Finger legen.</h2>
            </div>
        </div>
        <script src="js/script.js"></script>
    </body>
</html>
